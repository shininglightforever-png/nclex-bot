name: Delete duplicate FB reel (one-off)

on:
  workflow_dispatch: {}

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete duplicate reel #319-321 (second copy)
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: |
          G=https://graph.facebook.com/v21.0
          TOK=$(curl -s "$G/$FB_PAGE_ID?fields=access_token&access_token=$FB_PAGE_TOKEN" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("access_token",""))')
          [ -z "$TOK" ] && TOK=$FB_PAGE_TOKEN
          echo "DELETE: $(curl -s -X DELETE "$G/1890657908835015?access_token=$TOK")"
          echo "KEEP CHECK: $(curl -s "$G/1540554624563092?fields=id&access_token=$TOK")"
