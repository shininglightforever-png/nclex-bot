name: Post to socials

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub often runs these late, so check often)
  workflow_dispatch: {}    # "Run workflow" button for testing

permissions:
  contents: write

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # always the newest posted log, never the snapshot from when the run was queued
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Post due items
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          DRY_RUN: ${{ vars.DRY_RUN }}
        run: python post.py
      - name: Save what was posted
        run: |
          git config user.name "nclex-bot"
          git config user.email "nclex-bot@users.noreply.github.com"
          git add state/posted.json || true
          git diff --cached --quiet || (git commit -m "Update posted log" && git pull --rebase && git push)
